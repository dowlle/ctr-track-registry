name: Registry policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_HEAD: ${{ github.event.pull_request.head.sha }}
      PULL_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run base policy against the merge's data blobs
        run: |
          git fetch --no-tags --depth=2 origin "refs/pull/$PULL_NUMBER/merge"
          candidate=$(git rev-parse FETCH_HEAD)
          python3 -I tools/check_change.py "$BASE_SHA" "$candidate" --pull-head "$PULL_HEAD"
