name: Registry check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  select-check-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.select.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Select the bootstrap or candidate check
        id: select
        run: |
          name="check candidate"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ ! -f .github/workflows/registry-policy.yml ]; then
            name=check
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  candidate:
    name: ${{ needs.select-check-name.outputs.name }}
    needs: select-check-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CANDIDATE_SHA: ${{ github.sha }}
      PULL_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check candidate data with the base checker
        run: |
          if [ -n "$PULL_HEAD" ]; then
            python3 -I tools/check_change.py "$BASE_SHA" "$CANDIDATE_SHA" --pull-head "$PULL_HEAD"
          else
            python3 -I tools/check_change.py "$BASE_SHA" "$CANDIDATE_SHA"
          fi

      - name: Check the candidate checker and run its regression suite
        run: |
          previous=$(mktemp -d)
          git archive "$BASE_SHA" | tar -x -C "$previous"
          python3 -I tools/check_registry.py . --previous "$previous"
          python3 -B tools/test_check_registry.py -v
